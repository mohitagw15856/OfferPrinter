<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OfferPrinter</title>
    <style>
      :root { color-scheme: light dark; --accent: #6c4ab6; --ok: #2ea44f; --warn: #b8860b; }
      body {
        font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        width: 320px; margin: 0; padding: 16px;
      }
      h1 { font-size: 15px; margin: 0 0 2px; }
      p  { margin: 0 0 12px; color: #6b7280; font-size: 12.5px; }
      button {
        width: 100%; padding: 10px 12px; font-size: 14px; font-weight: 600;
        border: 0; border-radius: 8px; background: var(--accent); color: #fff;
        cursor: pointer;
      }
      button:hover { filter: brightness(1.08); }
      button.secondary { background: transparent; color: var(--accent);
        border: 1px solid currentColor; margin-top: 8px; font-weight: 500; }
      #status { margin-top: 12px; font-size: 12.5px; min-height: 1.4em; }
      .ok { color: var(--ok); } .warn { color: var(--warn); }
      code {
        display: block; margin-top: 10px; padding: 8px; border-radius: 6px;
        background: rgba(127,127,127,.14); font-size: 11.5px; word-break: break-all;
      }
      .meta { font-size: 11.5px; color: #6b7280; margin-top: 6px; }
    </style>
  </head>
  <body>
    <h1>🖨 Grab this job description</h1>
    <p>Reads the advert from this tab. Select text first if the page is unusual.</p>

    <button id="copy">Copy for OfferPrinter</button>
    <button id="download" class="secondary">Save as .txt</button>

    <div id="status"></div>
    <div id="meta" class="meta"></div>
    <code id="hint" hidden>offerprinter --cv ~/cv.pdf --jd-clipboard</code>

    <script src="popup.js"></script>
  </body>
</html>
