name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    name: Ruff lint + format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install "ruff>=0.5"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  imports:
    name: Import + CLI --help smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import package
        run: python -c "import offerprinter; from offerprinter.controllers.pipeline import Pipeline; print('ok', offerprinter.__version__)"

      - name: CLI help
        run: python cli.py --help
