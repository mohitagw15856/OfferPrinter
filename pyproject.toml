[project]
name = "offerprinter"
version = "0.2.0"
description = "Free, local-first AI job application generator: one CV + one job description, and it prints a tailored CV, cover letter, fit memo, ATS keyword report and interview prep pack — without fabricating anything."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OfferPrinter contributors" }]
keywords = [
    "job-application",
    "cv",
    "resume",
    "resume-builder",
    "cover-letter",
    "cover-letter-generator",
    "ats",
    "ats-resume",
    "job-search",
    "career",
    "interview-preparation",
    "llm",
    "ai",
    "claude",
    "openai",
    "local-first",
    "cli",
]
# Classifiers are how people find a package on PyPI — treat them as metadata,
# not boilerplate.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
    "Typing :: Typed",
]

# Runtime dependencies. Kept deliberately small: providers are called over
# their plain REST APIs via httpx, so we do not pull in four separate vendor
# SDKs, and PDF output is written by hand rather than by a rendering engine.
dependencies = [
    "httpx>=0.27",           # HTTP client for LLM providers and JD URL fetching
    "pydantic>=2.6",         # typed models for the data that flows through the pipeline
    "tomli>=2.0; python_version < '3.11'",  # TOML parsing fallback (stdlib tomllib on 3.11+)
    "python-docx>=1.1",      # read .docx CVs and write .docx outputs
    "pypdf>=4.2",            # read .pdf CVs
    "selectolax>=0.3.21",    # fast, dependency-light HTML text extraction for JD URLs
    "typer>=0.12",           # CLI framework (rich --help out of the box)
    "rich>=13.7",            # pretty CLI output and the printer animation
]

[project.optional-dependencies]
# The web UI is optional so `pipx install offerprinter` stays small and fast.
web = ["streamlit>=1.36"]
dev = [
    "ruff>=0.5",             # lint + format
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "streamlit>=1.36",
]
all = ["offerprinter[web]"]

[project.scripts]
offerprinter = "offerprinter.cli:app"
# A short alias, because you will type this a lot during a job hunt.
opr = "offerprinter.cli:app"

[project.urls]
Homepage = "https://github.com/mohitagw15856/OfferPrinter"
Repository = "https://github.com/mohitagw15856/OfferPrinter"
Documentation = "https://github.com/mohitagw15856/OfferPrinter#readme"
Issues = "https://github.com/mohitagw15856/OfferPrinter/issues"
Changelog = "https://github.com/mohitagw15856/OfferPrinter/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["offerprinter"]

[tool.hatch.build.targets.sdist]
include = [
    "offerprinter",
    "tests",
    "examples",
    "docs",
    "app.py",
    "cli.py",
    "config.example.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# A pragmatic, readable default: pycodestyle, pyflakes, isort, bugbear, pyupgrade.
select = ["E", "F", "I", "B", "UP", "W"]
# E501: line length is handled by the formatter, not the linter.
# B008: Typer's public API intentionally uses `typer.Option(...)` as a default.
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["offerprinter"]
omit = ["*/tests/*"]
