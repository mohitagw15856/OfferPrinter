# OfferPrinter configuration.
#
#   cp config.example.toml config.toml
#
# Precedence (highest wins): environment variables → config.toml → defaults.
# The only thing you MUST provide is an API key — and not even that if you run
# a local model with the `ollama` provider.
#
# config.toml is git-ignored, so it is safe to keep your key here.

[llm]
# Which provider to call.
#   anthropic | openai | gemini | kimi | ollama          (env: OFFERPRINTER_PROVIDER)
provider = "anthropic"

# Leave blank to use the provider's default model, which is always the
# cheapest capable one:
#   anthropic → claude-haiku-4-5-20251001
#   openai    → gpt-4o-mini
#   gemini    → gemini-1.5-flash
#   kimi      → moonshot-v1-8k
#   ollama    → llama3.1               (runs on your machine, costs nothing)
model = ""                                             # env: OFFERPRINTER_MODEL

# Prefer the standard per-provider environment variable (ANTHROPIC_API_KEY,
# OPENAI_API_KEY, GEMINI_API_KEY, MOONSHOT_API_KEY) over putting a key here.
api_key = ""                                           # env: OFFERPRINTER_API_KEY

# Point at a proxy, gateway, or any OpenAI-compatible endpoint. Leave blank
# for the provider's own API. For a local LM Studio / llama.cpp server, set
# provider = "openai" and base_url = "http://localhost:1234".
base_url = ""                                          # env: OFFERPRINTER_BASE_URL

temperature = 0.2      # low = faithful and deterministic; this is a features, not a bug
max_tokens = 4096
timeout = 120          # seconds per call

# A single rate limit should not kill a five-document run. Failed calls are
# retried with exponential backoff, honouring the server's Retry-After header.
max_retries = 3
retry_backoff = 1.5    # seconds for the first retry; doubles each attempt

[output]
locale = "UK"          # UK | US                        (env: OFFERPRINTER_LOCALE)
dir = "./output"       # where packages are written     (env: OFFERPRINTER_OUTPUT_DIR)

# Which file formats to write. Any of: "md", "docx", "pdf".
# PDFs are generated in plain Helvetica with real selectable text, which is
# exactly what an ATS wants.
formats = ["md", "docx", "pdf"]                        # env: OFFERPRINTER_FORMATS

# Record each run in ~/.offerprinter/applications.json so `offerprinter list`
# and `offerprinter stats` can show your history. Purely local; delete the
# file any time. Set false to keep no history at all.
track = true                                           # env: OFFERPRINTER_TRACK

# Strip your name, email, phone number and profile links before the CV is sent
# anywhere, and put them back in the generated documents afterwards. The model
# still sees every employer, date and metric it needs — just not who you are.
redact = false                                         # env: OFFERPRINTER_REDACT

[generation]
# Turn any artifact off to spend fewer tokens.
tailored_cv = true
cover_letter = true
fit_memo = true
ats_report = true
interview_prep = true

# One extra cheap call that scores the match 0-100 and bands it, strictly on
# evidence in your CV. It is the fastest way to decide whether a role is worth
# your evening.
fit_score = true

# Generate all artifacts concurrently. They are independent of each other, so
# this makes a full run about as slow as its slowest single document rather
# than the sum of all of them. Set false if your provider rate-limits hard.
parallel = true                                        # env: OFFERPRINTER_PARALLEL
max_workers = 5

# After generating, check every number, date and named entity in the tailored
# CV and cover letter against your source CV, and cross-check the tailored CV
# against the ATS report's own list of gaps. Writes fabrication-check.md.
# This is what turns the no-fabrication promise into something provable, so
# leave it on unless you have a reason not to.
verify = true                                          # env: OFFERPRINTER_VERIFY

# Record what tailoring actually changed — reworded bullets, added lines,
# vocabulary introduced — so you can audit it in thirty seconds.
# Writes tailoring-diff.md.
diff = true

# Reuse identical previous responses instead of paying for them again. The key
# includes the provider, model, temperature and both prompts, so anything that
# could change the answer correctly misses. Inspect it with
# `offerprinter cache stats`, empty it with `offerprinter cache clear`.
cache = true                                           # env: OFFERPRINTER_CACHE

# Optional. Cost reporting uses published list prices, which change and may not
# match your account. Override any model here, in USD per 1,000,000 tokens.
# [pricing]
# "claude-haiku-4-5-20251001" = { input = 1.0, output = 5.0 }
# "my-companys-proxy-model"   = { input = 0.0, output = 0.0 }
