<text x="333.0" y="20.5" text-anchor="middle" fill="#6b7487" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">offerprinter — zsh</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" xml:space="preserve">
<text x="22" y="67.6" fill="#7bd88f" opacity="1" xml:space="preserve"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0187;0.0248;0.94;1" dur="16.0s" repeatCount="indefinite"/>$ pipx install offerprinter</text>
<text x="22" y="89.2" fill="#6b7487" opacity="1" xml:space="preserve"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0625;0.0685;0.94;1" dur="16.0s" repeatCount="indefinite"/>  installed package offerprinter 0.2.0 (Python 3.12)</text>
<text x="22" y="110.8" fill="#6b7487" opacity="1" xml:space="preserve"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0813;0.0873;0.94;1" dur="16.0s" repeatCount="indefinite"/>  These apps are now globally available:  offerprinter  opr</text>
<text x="22" y="132.4" fill="#7bd88f" opacity="1" xml:space="preserve"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1313;0.1373;0.94;1" dur="16.0s" repeatCount="indefinite"/>$ offerprinter --cv ~/cv.pdf --jd "https://careers.northbank.com/812"</text>
<text x="22" y="154.0" fill="#5ad4e6" opacity="1" xml:space="preserve"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1750;0.1810;0.94;1" dur="16.0s" repeatCount="indefinite"/>  OfferPrinter   anthropic - claude-haiku-4-5 - UK - md,docx,pdf</text>
<text x="22" y="175.6" fill="#ffffff" opacity="1" xml:space="preserve"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2062;0.2122;0.94;1" dur="16.0s" repeatCount="indefinite"/>  Target role: Senior Product Analyst at NorthBank</text>
<text x="22" y="197.2" fill="#6b7487" opacity="1" xml:space="preserve"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2375;0.2435;0.94;1" dur="16.0s" repeatCount="indefinite"/>  printing 5 documents in parallel ...</text>
<text x="22" y="218.8" fill="#7bd88f" opacity="1" xml:space="preserve"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2750;0.2810;0.94;1" dur="16.0s" repeatCount="indefinite"/>      [+] Tailored CV</text>
<text x="22" y="240.4" fill="#7bd88f" opacity="1" xml:space="preserve"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3125;0.3185;0.94;1" dur="16.0s" repeatCount="indefinite"/>      [+] ATS Keyword Report</text>
