<text x="22" y="283.6" fill="#7bd88f" opacity="1" xml:space="preserve"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3750;0.3810;0.94;1" dur="16.0s" repeatCount="indefinite"/>      [+] Fit Memo</text>
