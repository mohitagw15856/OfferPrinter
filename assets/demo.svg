<text x="22" y="348.4" fill="#6b7487" opacity="1" xml:space="preserve"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4875;0.4935;0.94;1" dur="16.0s" repeatCount="indefinite"/>    A genuinely competitive application. Send it.</text>
<text x="22" y="370.0" fill="#6b7487" opacity="1" xml:space="preserve"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5125;0.5185;0.94;1" dur="16.0s" repeatCount="indefinite"/>    Real gaps: dbt; financial services domain</text>
<text x="22" y="391.6" fill="#7bd88f" opacity="1" xml:space="preserve"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5625;0.5685;0.94;1" dur="16.0s" repeatCount="indefinite"/>  Package written to output/northbank-senior-product-analyst/</text>
<text x="22" y="413.2" fill="#6b7487" opacity="1" xml:space="preserve"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5875;0.5935;0.94;1" dur="16.0s" repeatCount="indefinite"/>    7 calls - 24,318 tokens - $0.038 (about £0.030)</text>
<text x="22" y="434.8" fill="#6b7487" opacity="1" xml:space="preserve"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6125;0.6185;0.94;1" dur="16.0s" repeatCount="indefinite"/>    Every line is drawn from your real CV - review before sending.</text>
<text x="22" y="456.4" fill="#cb7cff" opacity="1" xml:space="preserve"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6625;0.6685;0.94;1" dur="16.0s" repeatCount="indefinite"/>  Achievement unlocked: Bullseye - scored 85+ on a role</text>
