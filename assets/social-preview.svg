<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="OfferPrinter — one CV plus one job description becomes a tailored CV, cover letter, fit memo, ATS keyword report and interview prep pack, with zero fabrication">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0d0f16"/><stop offset="55%" stop-color="#161a26"/><stop offset="100%" stop-color="#0d0f16"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.30"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1280" height="640" fill="url(#bg)"/>
<circle cx="1090" cy="150" r="360" fill="url(#glow)"/>
<rect x="0" y="0" width="1280" height="6" fill="url(#accent)"/>
<text x="72" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#22d3ee" letter-spacing="3">FREE &amp; OPEN SOURCE &#183; MIT</text>
<text x="72" y="215" font-family="Inter, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="82" font-weight="800" fill="#f4f6fb">&#128424; OfferPrinter</text>
<text x="72" y="285" font-family="Inter, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="36" font-weight="600" fill="#f4f6fb">One CV. One job description.</text>
<text x="72" y="333" font-family="Inter, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="36" font-weight="600" fill="url(#accent)">Five documents. Zero fabrication.</text>
<text x="72" y="399" font-family="Inter, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" fill="#8b95ad">Runs on your machine, on your own API key.</text>
<text x="72" y="435" font-family="Inter, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" fill="#8b95ad">It never invents experience &#8212; real gaps get flagged.</text>
<rect x="72" y="480" width="560" height="62" rx="12" fill="#000000" fill-opacity="0.45" stroke="#8b5cf6" stroke-opacity="0.45"/>
<text x="100" y="520" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" fill="#4ade80">$ <tspan fill="#f4f6fb">pipx install offerprinter</tspan></text>
<text x="72" y="590" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#8b95ad">github.com/mohitagw15856/OfferPrinter</text>
<rect x="810" y="114" width="400" height="72" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
<rect x="810" y="114" width="5" height="72" rx="2.5" fill="url(#accent)"/>
<text x="844" y="159" font-family="Inter, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#f4f6fb">Tailored CV</text>
<rect x="810" y="204" width="400" height="72" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
<rect x="810" y="204" width="5" height="72" rx="2.5" fill="url(#accent)"/>
<text x="844" y="249" font-family="Inter, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#f4f6fb">Cover letter</text>
<rect x="810" y="294" width="400" height="72" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
<rect x="810" y="294" width="5" height="72" rx="2.5" fill="url(#accent)"/>
<text x="844" y="339" font-family="Inter, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#f4f6fb">Fit memo</text>
<rect x="810" y="384" width="400" height="72" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
<rect x="810" y="384" width="5" height="72" rx="2.5" fill="url(#accent)"/>
<text x="844" y="429" font-family="Inter, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#f4f6fb">ATS keyword report</text>
<rect x="810" y="474" width="400" height="72" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
<rect x="810" y="474" width="5" height="72" rx="2.5" fill="url(#accent)"/>
<text x="844" y="519" font-family="Inter, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#f4f6fb">Interview prep pack</text>
</svg>
